; M5Stack Cardputer-Adv + Cap LoRa868 (SX1262 + GPS) multi-app LoRa suite.
;
; The portable protocol core (src/proto, src/crypto) is unit-tested on the host
; with g++ via test/native/run.sh -- no board or PlatformIO required. This env
; builds the full firmware for the device.

[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3           ; StampS3A (ESP32-S3FN8); adjust if an ADV-specific board id ships
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    m5stack/M5Cardputer
    jgromes/RadioLib @ ^6.6
    mikalhart/TinyGPSPlus @ ^1.0.3
    h2zero/NimBLE-Arduino @ ^1.4.2
    bblanchon/ArduinoJson @ ^7.0
